name: Release Please

on:
  push:
    branches: [ main ]

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # The steps below run only when the release PR is merged and the GitHub
      # Release has just been created: build the plugin and attach the jar.
      - uses: actions/checkout@v7
        if: ${{ steps.release.outputs.release_created }}

      - name: Set up JDK
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build plugin jar
        if: ${{ steps.release.outputs.release_created }}
        run: mvn -B package --file pom.xml

      - name: Attach jar to release
        if: ${{ steps.release.outputs.release_created }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ steps.release.outputs.tag_name }}" target/protectionstones-*.jar --clobber
